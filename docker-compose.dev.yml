# Sólo la base, para trabajar con la API y la web corriendo en la máquina:
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:17-alpine
    container_name: ecolentes-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecolentes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecolentes}
      POSTGRES_DB: ${POSTGRES_DB:-ecolentes}
    ports:
      - "5432:5432"
    volumes:
      - ecolentes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecolentes}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecolentes-db-data:
