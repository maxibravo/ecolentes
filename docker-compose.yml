services:
  db:
    image: postgres:17-alpine
    container_name: ecolentes-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecolentes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecolentes}
      POSTGRES_DB: ${POSTGRES_DB:-ecolentes}
    ports:
      - "5432:5432"
    volumes:
      - ecolentes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecolentes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecolentes-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker la base se llama "db", no localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecolentes}:${POSTGRES_PASSWORD:-ecolentes}@db:5432/${POSTGRES_DB:-ecolentes}?schema=public
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      API_PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ecolentes-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  ecolentes-db-data:
